# Run the dice roller from the published image. Only this file is needed; no source code.
#
#   docker compose -f dungeon.yaml up -d dungeon    create and start it, then open http://localhost:8080
#   docker stop dungeon                             stop it
#   docker start dungeon                            start it again
#   docker compose -f dungeon.yaml pull             fetch the newest version (then run "up -d" again)
#   docker compose -f dungeon.yaml down             stop and remove it
#
# To use a different port, e.g. 9000:   PORT=9000 docker compose -f dungeon.yaml up -d dungeon

name: dungeon

services:
  dungeon:
    image: ghcr.io/millermatt090/dnd:latest
    container_name: dungeon
    ports:
      - "${PORT:-8080}:8000" # browser port : port the server listens on inside the container
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
