<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dice Roller</title>
    <link rel="stylesheet" href="/app/shared/theme.css">
    <link rel="stylesheet" href="/app/shared/base.css">
    <link rel="stylesheet" href="/app/die-button/die-button.css">
    <link rel="stylesheet" href="/app/pool-tray/pool-tray.css">
    <link rel="stylesheet" href="/app/results-view/results-view.css">
</head>
<body>
    <h1>🎲 Dice Roller</h1>

    <p class="hint">Click dice to add them, then roll them all at once.</p>

    <div class="dice">
        <button class="die" data-die="d4" title="Add d4">
            <img src="/assets/d4/4.png" alt="d4">
            <span class="badge"></span>
        </button>
        <button class="die" data-die="d6" title="Add d6">
            <img src="/assets/d6/6.png" alt="d6">
            <span class="badge"></span>
        </button>
        <button class="die" data-die="d8" title="Add d8">
            <img src="/assets/d8/8.png" alt="d8">
            <span class="badge"></span>
        </button>
        <button class="die" data-die="d10" title="Add d10">
            <img src="/assets/d10/10.png" alt="d10">
            <span class="badge"></span>
        </button>
        <button class="die" data-die="d12" title="Add d12">
            <img src="/assets/d12/12.png" alt="d12">
            <span class="badge"></span>
        </button>
        <button class="die" data-die="d20" title="Add d20">
            <img src="/assets/d20/20.png" alt="d20">
            <span class="badge"></span>
        </button>
        <button class="die" data-die="d100" title="Add d%">
            <img src="/assets/d100/00.png" alt="d%">
            <span class="badge"></span>
        </button>
    </div>

    <div class="tray">
        <div id="pool-summary">No dice selected</div>
        <div class="tray-actions">
            <button id="roll-button" class="action primary" disabled>Roll</button>
            <button id="clear-button" class="action" disabled>Clear</button>
        </div>
    </div>

    <div id="faces"></div>
    <div id="result">–</div>
    <div id="detail"></div>

    <script type="module" src="/app/main.js"></script>
</body>
</html>
