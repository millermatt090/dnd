<header class="title-block">
    <p class="eyebrow">Ye Olde</p>
    <h1>Dice Tower</h1>
    <div class="flourish" aria-hidden="true">
        <span class="line"></span>
        <span class="gem">◆</span>
        <span class="line"></span>
    </div>
    <p class="hint">Choose thy dice, then cast them upon the table.</p>
</header>

<section class="shelf" aria-label="Dice">
    <div class="dice">
        @for (die of dieOrder; track die) {
            <app-die-button [die]="die" />
        }
    </div>
</section>

<app-pool-tray (roll)="roll()" />

<app-dice-board id="board" />
