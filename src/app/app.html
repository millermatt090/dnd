<header class="title-block">
    <p class="eyebrow">Ye Olde</p>
    <h1>Dice Tower</h1>
    <div class="flourish" aria-hidden="true">
        <span class="line"></span>
        <span class="gem">◆</span>
        <span class="line"></span>
    </div>
</header>

<nav class="tabs" aria-label="Views">
    @for (tab of views; track tab.id) {
        <button
            type="button"
            class="tab"
            [class.active]="view() === tab.id"
            [attr.aria-current]="view() === tab.id ? 'page' : null"
            [attr.data-view]="tab.id"
            (click)="view.set(tab.id)"
        >
            {{ tab.label }}
        </button>
    }
</nav>

<app-dice-view [hidden]="view() !== 'dice'" />

<app-spellbook [hidden]="view() !== 'spells'" />
