# Builds the Docker image and publishes it to GitHub Container Registry:
#   ghcr.io/millermatt090/dnd
#
# - Every push to main publishes :latest (and :sha-<commit>). This is the newest, possibly unreleased, code.
# - Every push to a version branch, named like 1.2.0, publishes :1.2.0, :1.2 and :1 (and :sha-<commit>).
# - It can also be started by hand from the Actions tab.
#
# Images are built for Intel/AMD (linux/amd64) and ARM (linux/arm64, e.g. Apple Silicon Macs).

name: Publish image

on:
  push:
    branches:
      - main
      - "[0-9]+.[0-9]+.[0-9]+" # version branches, e.g. 1.0.0
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up QEMU (ARM emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}},value=${{ github.ref_name }},enable=${{ github.ref_name != 'main' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }},enable=${{ github.ref_name != 'main' }}
            type=semver,pattern={{major}},value=${{ github.ref_name }},enable=${{ github.ref_name != 'main' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
